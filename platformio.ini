[platformio]
default_envs = nologo_esp32c3_super_mini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_flags =
   -std=c++17
   -Wall
   -Wextra
;   -Werror
   -DDEBUG_ESP_PORT=Serial1
;   -DARDUINO_USB_CDC_ON_BOOT=1
;   -DARDUINO_USB_MODE=1

upload_speed = 921600
monitor_speed = 115200

board_build.filesystem = littlefs

;lib_extra_dirs =
;    /home/frank/PIO_libs

lib_deps =
   hasenradball/AM2302-Sensor@1.4.0
;   hasenradball/DS3231-RTC@^1.1.0

[env:nologo_esp32c3_super_mini]
board = nologo_esp32c3_super_mini

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
;monitor_port = /dev/cu.usbmodem2101

[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02

